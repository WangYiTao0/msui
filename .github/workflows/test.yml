# push / PR 都跑全量测试。msui 是公开仓，Actions 分钟数免费，
# 不必像主仓 MSToolbox 那样为省钱只认 build/** 分支。
name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: 1/3 取代码
        uses: actions/checkout@v4

      - name: 2/3 装 Python 3.12 + 依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # editable 装：版本一致性测试比的是安装元数据，与本地跑法一致
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 3/3 pytest 全量
        run: python -m pytest -q -rs

  # 冻结产物冒烟：真打探针 onedir，在 Windows（目标平台，自带 WebView2）上
  # 隐藏开窗读 getComputedStyle，钉死两条待验条款——页面目录可写性（含窗口
  # 开着时覆盖写 css）与冻结产物里的版本元数据。ubuntu 跑不了 WebView2，
  # 所以单独一个 windows job，与上面的 pytest 并列。
  freeze-smoke:
    name: freeze smoke (windows)
    runs-on: windows-latest
    steps:
      - name: 1/5 取代码
        uses: actions/checkout@v4

      - name: 2/5 装 Python 3.12 + 依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 非 editable 安装：冒烟验的是「装出来的包」——entry-point hook 的发现
      # 走安装元数据，editable 与真实下游的形态不同
      - run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" pyinstaller

      - name: 3/5 pytest 全量（Windows 口径——copy_assets 的可写性语义两平台不同）
        run: python -m pytest -q -rs

      - name: 4/5 真打探针 onedir（spec 对 msui 资源零配置，全靠包自带 hook）
        run: pyinstaller tests/smoke/probe.spec --noconfirm --distpath tests/smoke/dist --workpath tests/smoke/build

      - name: 5/5 跑冻结冒烟（隐藏窗口，SMOKE-RESULT 一行是全部读数）
        shell: bash
        run: |
          export MSUI_EXPECTED_VERSION="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          ./tests/smoke/dist/probe/probe.exe

# push / PR 都跑全量测试。msui 是公开仓，Actions 分钟数免费，
# 不必像主仓 MSToolbox 那样为省钱只认 build/** 分支。
name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: 1/3 取代码
        uses: actions/checkout@v4

      - name: 2/3 装 Python 3.12 + 依赖
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # editable 装：版本一致性测试比的是安装元数据，与本地跑法一致
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 3/3 pytest 全量
        run: python -m pytest -q -rs

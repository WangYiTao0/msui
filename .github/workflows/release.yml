# 推 v<版本号> tag → 版本闸门 → 测试 → 构建 wheel → 发到**本仓** Release。
#
# 两个要点：
#   - 发布目标就是本仓（msui 本身是公开仓，匿名可下），不跨仓，
#     所以用自带 GITHUB_TOKEN 即可，零 PAT、零 secret；
#   - 版本闸门在**装任何依赖之前**跑——scripts/check_tag_version.py 只用
#     标准库，tag 与 pyproject.toml 版本不一致当场 fail，不浪费后面的步骤。
#
# 产物是纯 Python wheel，ubuntu 一台就够，没有 Windows 打包链。
# 下游安装（钉版本的 wheel URL，无凭据 pip install）：
#   msui @ https://github.com/WangYiTao0/msui/releases/download/v0.2.0/msui-0.2.0-py3-none-any.whl
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # gh release create 要写本仓 Releases；用的就是自带 GITHUB_TOKEN

jobs:
  release:
    name: 版本闸门 → 测试 → 构建 wheel → 发 Release
    runs-on: ubuntu-latest
    steps:
      - name: 1/6 取代码
        uses: actions/checkout@v4

      - name: 2/6 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 3/6 版本一致性闸门（装依赖之前）
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "本次 tag：$TAG"
          python scripts/check_tag_version.py "$TAG" pyproject.toml

      - name: 4/6 装依赖 + pytest 全量
        # 发给下游装的版本，测试红了不该照样发出去
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest -q -rs

      - name: 5/6 构建 wheel + sdist
        run: |
          python -m build
          ls -1 dist

      - name: 6/6 发 Release（自带 GITHUB_TOKEN，零 PAT）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "msui $TAG" \
            --notes "自动发布（.github/workflows/release.yml）。下游 requirements 写钉版本的 wheel URL 安装：msui @ https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/msui-${TAG#v}-py3-none-any.whl"

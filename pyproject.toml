[project]
name = "msui"
# 版本号**只写这里一处**（tests/test_version.py 盯着这个单一来源）。
# 发布：git tag v<这个号> && git push origin v<这个号>，
# CI 在装依赖之前核对 tag 与这里一致，不一致当场 fail（scripts/check_tag_version.py）。
version = "0.6.0"
description = "小程序共享 UI 运行时与样式（pywebview + WebView2）——骨架先行，功能后续迁入"
readme = "README.md"
# 本包要被同一批小程序装，下限与它们的运行环境对齐（3.11 起有 tomllib）。
requires-python = ">=3.11"
# shell.run 要开 pywebview 窗口（import 在 run() 函数体内，没装也能 import
# 本包，但作为发行版依赖必须声明——装了 msui 就该装得上开窗的底座）。
dependencies = ["pywebview"]

# PyInstaller 的 hook 发现入口：下游 spec 一行资源配置都不写也能收齐
# 本包的静态资产与版本元数据（hook 内容见 src/msui/_pyinstaller/hook-msui.py）。
[project.entry-points.pyinstaller40]
hook-dirs = "msui._pyinstaller:get_hook_dirs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # tests/test_wheel.py 用 python -m build --no-isolation 真构建一次 wheel，
    # 所以 build 与 hatchling 都要装在 dev 环境里。
    "build>=1.0",
    "hatchling",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msui"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
# examples 也进测试路径：示例里的闸门测试在本仓 CI 就得跑绿——README 让
# 下游照抄的东西，本仓自己先抄着跑一遍。
testpaths = ["tests", "examples"]
